<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Live Score Cards</title>
<link rel="preconnect" href="https://site.api.espn.com">
<script>
(function(){var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t})();
</script>
<style>
:root{--bg:#f4f5f7;--fg:#111827;--card:#fff;--mut:#6b7280;--bd:#e5e7eb;--live:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f14;--fg:#e5e7eb;--card:#151b23;--mut:#9ca3af;--bd:#263040}}
:root[data-theme=light]{--bg:#f4f5f7;--fg:#111827;--card:#fff;--mut:#6b7280;--bd:#e5e7eb}
:root[data-theme=dark]{--bg:#0b0f14;--fg:#e5e7eb;--card:#151b23;--mut:#9ca3af;--bd:#263040}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
h1{font-size:1.1rem;margin:0}
h2{font-size:1rem;margin:0 0 10px}
select{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;font:inherit;min-height:40px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--bd)}
nav a{flex:none;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;min-height:48px;padding:0 16px;border:1px solid var(--bd);border-radius:24px;background:var(--card);color:inherit;text-decoration:none;font-weight:600}
nav a[aria-current=page]{border-color:var(--fg)}
nav a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ic{flex:none;width:1.25em;text-align:center;font-size:1.2rem;line-height:1}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--live);visibility:hidden}
a.live .dot{visibility:visible}
.vw{display:flex;gap:8px;padding:10px 16px 0}
.vw a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border:1px solid var(--bd);border-radius:22px;background:var(--card);color:inherit;text-decoration:none;font-weight:600}
.vw a[aria-current=page]{border-color:var(--fg)}
.vw a:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
#bk{padding:0 16px;min-height:480px}
.vw[hidden],#bk[hidden]{display:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
main{padding:0 16px}
.p[hidden]{display:none}
section{padding:16px 0}
hr{border:0;border-top:1px solid var(--bd);margin:0}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));column-gap:12px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px;display:grid;grid-row:span 4;grid-template-rows:auto auto auto auto}
@supports(grid-template-rows:subgrid){.c{grid-template-rows:subgrid;row-gap:0}}
.s{display:flex;justify-content:space-between;color:var(--mut);font-size:.8rem;margin-bottom:8px}
.s b{color:var(--mut)}.s b.lv{color:var(--live)}
.t{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-weight:600}
.t img{width:24px;height:24px;margin-right:8px;vertical-align:middle}
.t i{font-style:normal;font-size:1.3rem;font-variant-numeric:tabular-nums}
.m{color:var(--mut);font-size:.75rem;line-height:1.3;min-height:1.3em;margin-top:8px;padding-top:8px;border-top:1px solid var(--bd);overflow-wrap:anywhere}
.e{color:var(--mut);font-size:.9rem}
#u{padding:0 16px 16px;color:var(--mut);font-size:.75rem;min-height:1.5em}
</style>
</head>
<body>
<header><h1>Live Score Cards</h1>
<select id="th" aria-label="Theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></header>
<nav id="n" aria-label="Sports"></nav>
<div class="vw" id="vw" hidden><a id="va">Live</a><a id="vb">Bracket</a></div>
<main id="m"></main>
<div id="bk" hidden></div>
<div id="u" role="status"></div>
<script>
(function(){
var B="https://site.api.espn.com/apis/site/v2/sports/",SLOW=60000,
SP=[
["nfl","NFL","🏈",15000,[["football/nfl",""]]],
["nba","NBA","🏀",10000,[["basketball/nba",""]]],
["wnba","WNBA","🏀",10000,[["basketball/wnba",""]]],
["mlb","MLB","⚾",15000,[["baseball/mlb",""]]],
["soccer","Soccer","⚽",15000,[["soccer/eng.1","Premier League"],["soccer/esp.1","La Liga"],["soccer/ger.1","Bundesliga"],["soccer/ita.1","Serie A"],["soccer/fra.1","Ligue 1"]]]
],
n=document.getElementById("n"),m=document.getElementById("m"),u=document.getElementById("u"),th=document.getElementById("th"),
G={"nfl": "AFC East:BUF MIA NE NYJ|AFC North:BAL CIN CLE PIT|AFC South:HOU IND JAX TEN|AFC West:DEN KC LAC LV|NFC East:DAL NYG PHI WSH|NFC North:CHI DET GB MIN|NFC South:ATL CAR NO TB|NFC West:ARI LAR SEA SF", "nba": "East · Atlantic:BKN BOS NY PHI TOR|East · Central:CHI CLE DET IND MIL|East · Southeast:ATL CHA MIA ORL WSH|West · Northwest:DEN MIN OKC POR UTAH|West · Pacific:GS LAC LAL PHX SAC|West · Southwest:DAL HOU MEM NO SA", "wnba": "East:ATL CHI CON IND NY TOR WSH|West:DAL GS LA LV MIN PHX POR SEA", "mlb": "AL East:BAL BOS NYY TB TOR|AL Central:CHW CLE DET KC MIN|AL West:ATH HOU LAA SEA TEX|NL East:ATL MIA NYM PHI WSH|NL Central:CHC CIN MIL PIT STL|NL West:ARI COL LAD SD SF"},GM={},S={},act,timer,vw=document.getElementById('vw'),va=document.getElementById('va'),vb=document.getElementById('vb'),bk=document.getElementById('bk'),bs,bsp;
th.value=localStorage.getItem("theme")||"system";
th.onchange=function(){var v=th.value,d=document.documentElement;if(v==="system"){localStorage.removeItem("theme");delete d.dataset.theme}else{localStorage.setItem("theme",v);d.dataset.theme=v}};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
SP.forEach(function(s){
  var k=s[0],o=S[k]={k:k,name:s[1],int:s[3],L:[],last:0,fails:0,live:0,busy:0,ac:null,upd:""};
  var a=document.createElement("a");a.href="#"+k;
  a.innerHTML='<span class="ic" aria-hidden="true">'+s[2]+'</span>'+s[1]+'<span class="dot" aria-hidden="true"></span><span class="vh"></span>';
  n.appendChild(a);o.a=a;
  var p=document.createElement("div");p.className="p";p.hidden=true;m.appendChild(p);o.p=p;
  s[4].forEach(function(l,i){
    var c=document.createElement("section");
    c.innerHTML=(l[1]?'<h2></h2>':'')+'<div class="g"></div><div class="e">No live or completed games today.</div>';
    if(l[1])c.firstChild.textContent=l[1];
    if(i)p.appendChild(document.createElement("hr"));
    p.appendChild(c);
    o.L.push({path:l[0],g:c.querySelector(".g"),e:c.querySelector(".e"),els:{},live:0});
  });
});
function grp(k,c){
  if(!GM[k]){GM[k]={};(G[k]||"").split("|").forEach(function(x){if(!x)return;var p=x.split(":");p[1].split(" ").forEach(function(a){GM[k][a]=p[0]})})}
  return GM[k][(c.team||{}).abbreviation]||""}
function meta(k,cs,ev,L){
  var a=grp(k,cs[0]),b=grp(k,cs[1]),g=a&&b?(a===b?a:a+" vs "+b):a||b||(k==="soccer"?"":""),
  nt=(ev.competitions[0].notes||[])[0],h=nt&&nt.headline||"";
  return [g,h].filter(Boolean).join(" · ")}
function team(c){var t=c.team||{};return '<div class="t"><span>'+(t.logo?'<img loading="lazy" width="24" height="24" alt="" src="'+esc(t.logo)+'">':"")+esc(t.shortDisplayName||t.abbreviation||t.displayName)+'<span class="w" aria-label="Winner"></span></span><i>'+esc(c.score)+'</i></div>'}
function render(o,L,events){
  var now=Date.now(),td=new Date().toDateString(),seen={},els=L.els,home=o.k==="soccer",
  st=function(x){return x.status&&x.status.type&&x.status.type.state},
  all=events.filter(function(x){var z=st(x);return z==="in"||z==="post"&&(new Date(x.date).toDateString()===td||now-new Date(x.date)<216e5)}).sort(function(a,b){return(st(a)==="in"?0:1)-(st(b)==="in"?0:1)}),
  live=all.filter(function(x){return st(x)==="in"});
  all.forEach(function(ev){
    var cs=ev.competitions[0].competitors.slice().sort(function(a,b){return(a.homeAway==="home")===home?-1:1}),x=els[ev.id];
    seen[ev.id]=1;
    if(!x){x=els[ev.id]=document.createElement("article");x.className="c";
      x.innerHTML='<div class="s"><b></b><span class="d"></span></div>'+team(cs[0])+team(cs[1])+'<div class="m"></div>';x.querySelector(".m").textContent=meta(o.k,cs,ev,L);L.g.appendChild(x)}
    var isl=st(ev)==="in",bb=x.firstChild.firstChild,bt=isl?"● LIVE":"Final";
    if(bb.textContent!==bt){bb.textContent=bt;bb.className=isl?"lv":""}
    var d=x.querySelector(".d"),dv=isl?ev.status.type.shortDetail||"":"";if(d.textContent!==dv)d.textContent=dv;
    var sc=x.querySelectorAll(".t i"),ws=x.querySelectorAll(".w");cs.forEach(function(c,i){var wv=!isl&&c.winner?" 🎉":"";if(ws[i].textContent!==wv)ws[i].textContent=wv;var v=String(c.score);if(sc[i].textContent!==v)sc[i].textContent=v});
  });
  Object.keys(els).forEach(function(id){if(!seen[id]){els[id].remove();delete els[id]}});
  all.forEach(function(ev,i){var x=els[ev.id];if(L.g.children[i]!==x)L.g.insertBefore(x,L.g.children[i]||null)});
  L.e.hidden=all.length>0;L.live=live.length;
}
function mark(o){
  o.live=o.L.reduce(function(t,L){return t+L.live},0);
  o.a.classList.toggle("live",o.live>0);
  o.a.lastChild.textContent=o.live?" (live games now)":"";
}
function fetchSport(o){
  if(o.busy)return;o.busy=1;
  var ac=o.ac=new AbortController(),ok=0;
  Promise.all(o.L.map(function(L){return fetch(B+L.path+"/scoreboard",{signal:ac.signal,cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){ok++;render(o,L,j.events||[])}).catch(function(x){if(x&&x.name==="AbortError")throw x})}))
  .then(function(){
    o.fails=ok?0:o.fails+1;o.last=Date.now();mark(o);
    if(ok)o.upd="Updated "+new Date().toLocaleTimeString();
    if(o===act)u.textContent=ok?o.upd:"Connection issue, retrying…";
  }).catch(function(){}).then(function(){o.busy=0});
}
function tick(){
  clearTimeout(timer);
  if(!document.hidden){
    var now=Date.now();
    SP.forEach(function(s){var o=S[s[0]],iv=Math.min((o===act?o.int:SLOW)*Math.pow(2,o.fails),120000);if(!o.busy&&now-o.last>=iv)fetchSport(o)});
  }
  timer=setTimeout(tick,2000);
}
function bracket(k){
  bsp=k;
  window.LSC={side:function(sp,a){return grp(sp,{team:{abbreviation:a}})},el:bk};
  if(window.BK)return BK.show(k);
  bk.textContent="Loading bracket…";
  if(!bs){bs=document.createElement("script");bs.src="bracket.js";bs.onload=function(){if(bsp)BK.show(bsp)};bs.onerror=function(){bs=0;bk.textContent="Could not load bracket."};document.head.appendChild(bs)}
}
function route(){
  var h=location.hash.slice(1).split("/"),k=S[h[0]]?h[0]:"nfl",b=h[1]==="bracket"&&k!=="soccer";
  if(act!==S[k]){
    if(act){act.p.hidden=true;act.a.removeAttribute("aria-current")}
    act=S[k];act.a.setAttribute("aria-current","page");
    document.title=act.name+" Live Score Cards";
    u.textContent=act.upd;
    if(act.last)act.last=0;
  }
  vw.hidden=k==="soccer";
  va.href="#"+k;vb.href="#"+k+"/bracket";
  (b?vb:va).setAttribute("aria-current","page");(b?va:vb).removeAttribute("aria-current");
  act.p.hidden=b;bk.hidden=!b;
  if(b)bracket(k);else{bsp=0;if(window.BK)BK.hide()}
  tick();
}
addEventListener("hashchange",route);
document.addEventListener("visibilitychange",function(){if(!document.hidden){SP.forEach(function(s){S[s[0]].last=0});tick()}});
addEventListener("online",function(){SP.forEach(function(s){S[s[0]].fails=0;S[s[0]].last=0});tick()});
route();
SP.forEach(function(s){var o=S[s[0]];if(o!==act)o.last=Date.now()-SLOW+2500});
})();
</script>
</body>
</html>
